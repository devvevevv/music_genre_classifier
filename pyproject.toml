[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "models", "dataset"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/train.py" = ["F403", "F405"]
"src/process_data.py" = ["F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["venv", "models", "dataset", "eval", "src/train.py", "src/process_data.py"]

[tool.coverage.run]
omit = ["tests/*", "venv/*", "eval/*"]
